<style>
:root{
  --bg:#fafaf7; --surface:#f1f1ec; --ink:#23242a; --muted:#62646d; --line:#dcdcd4;
  --gold:#f2c200; --gold-ink:#7a5f00; --word:#2a2b31; --shadec:#fff; --code:#1f2026; --ring:#d9d9d2;
  --shade:#fff; color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14151a; --surface:#1c1d24; --ink:#ececea; --muted:#9a9ca6; --line:#2c2d36;
    --gold:#fcd116; --gold-ink:#fcd116; --word:#ececea; --shadec:#000; --code:#e6e6e2; --ring:#ededed; --shade:#000; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14151a; --surface:#1c1d24; --ink:#ececea; --muted:#9a9ca6; --line:#2c2d36;
  --gold:#fcd116; --gold-ink:#fcd116; --word:#ececea; --shadec:#000; --code:#e6e6e2; --ring:#ededed; --shade:#000; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 "Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:21px;letter-spacing:.02em}
.brand svg{height:30px;width:auto;display:block}
nav{display:flex;align-items:center;gap:22px;font-size:15px;color:var(--muted)}
nav a:hover,nav a.on{color:var(--ink)}
.theme{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme:hover{border-color:var(--gold)}
.theme svg{width:18px;height:18px}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme .sun{display:block}:root:not([data-theme="light"]) .theme .moon{display:none}}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding:88px 0 72px}
h1{font-size:clamp(34px,5vw,56px);line-height:1.1;font-weight:500;letter-spacing:-.02em;margin:0 0 22px}
.lead{color:var(--muted);font-size:19px;max-width:32em;margin:0 0 30px}
.cta,.links{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:12px 24px;border-radius:999px;font-weight:500;font-size:16px;border:1px solid var(--line);transition:border-color .2s}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#23242a}
.btn.primary:hover{filter:brightness(.96)}
.btn:not(.primary):hover{border-color:var(--ink)}
.mark{width:100%;height:auto;overflow:visible;display:block}
section{padding:68px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(24px,3.2vw,34px);font-weight:500;letter-spacing:-.01em;margin:0 0 14px;line-height:1.2}
.intro{color:var(--muted);max-width:36em;margin:0 0 36px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--surface);border-radius:14px;padding:22px 24px;border:1px solid transparent}
.panel.after{border-color:var(--gold)}
.panel h3{margin:0 0 14px;font-size:16px;font-weight:500;color:var(--muted)}
.panel.after h3{color:var(--gold-ink)}
pre,code{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
pre{margin:0;font-size:13.5px;line-height:1.75;color:var(--code);overflow-x:auto;white-space:pre}
.block{background:var(--surface);border-radius:12px;padding:18px 22px;margin:0 0 22px}
.types{margin:0;padding:0;list-style:none}
.types li a{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:12px 32px;padding:20px 0;border-bottom:1px solid var(--line);align-items:baseline}
.types li:first-child a{padding-top:0}
.types code{font-size:15px;color:var(--gold-ink);font-weight:500}
.types b{display:block;font-weight:500;margin-bottom:2px}
.types span{color:var(--muted);font-size:16px}
.types a:hover b{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.install{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border-radius:14px;padding:18px 22px;max-width:560px;margin-bottom:28px}
.install code{font-size:15px;overflow-x:auto;white-space:nowrap}
.copy{flex:none;font:500 14px "Outfit",sans-serif;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.copy:hover{border-color:var(--gold)}
.page{padding:64px 0 80px;max-width:720px}
.page h1{font-size:clamp(32px,4.4vw,46px)}
.page h2{margin-top:44px;font-size:24px}
.page p{margin:0 0 16px}
.page .lead{margin-bottom:12px}
.page code:not(pre code){font-size:.88em;background:var(--surface);padding:2px 6px;border-radius:5px}
.docs{display:grid;grid-template-columns:210px 1fr;gap:56px;padding:56px 0 80px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);align-self:start;display:flex;flex-direction:column;gap:2px;font-size:15.5px}
.side a{padding:7px 12px;border-left:2px solid var(--line);color:var(--muted)}
.side a:hover{color:var(--ink)}
.side a.on{color:var(--ink);border-left-color:var(--gold);font-weight:500}
.doc{max-width:700px;min-width:0}
.doc h1{font-size:clamp(30px,4vw,42px)}
.doc h2{margin-top:40px;font-size:23px}
.doc p{margin:0 0 16px}
.doc code:not(pre code){font-size:.88em;background:var(--surface);padding:2px 6px;border-radius:5px}
.pn{display:flex;justify-content:space-between;gap:16px;margin-top:56px;padding-top:22px;border-top:1px solid var(--line);font-size:15.5px}
.pn a{color:var(--muted)}.pn a:hover{color:var(--ink)}
footer{border-top:1px solid var(--line);padding:36px 0 48px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center}
footer .f{display:flex;gap:22px;flex-wrap:wrap}
footer a:hover{color:var(--ink)}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding:48px 0;gap:32px}
  .mark-box{order:-1;max-width:340px}
  .compare{grid-template-columns:1fr}
  .types li a{grid-template-columns:1fr;gap:6px}
  .docs,.docs.has-otp{grid-template-columns:1fr;gap:28px;padding-top:32px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px}
  .side a{border:1px solid var(--line);border-radius:999px;white-space:nowrap;padding:6px 14px}
  .side a.on{border-color:var(--gold)}
  nav{gap:16px}
  section{padding:52px 0}
}
.doc h3{font:500 15px/1.5 "JetBrains Mono",ui-monospace,Menlo,monospace;margin:34px 0 10px;color:var(--ink);word-break:break-word}
.doc .block{margin:0 0 18px}
.doc pre{font-size:13px}
.note{background:var(--surface);border-left:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin:0 0 18px}
.bl{margin:0 0 16px;padding-left:22px}.bl li{margin:4px 0}
.ln{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.doc h2,.doc h3{scroll-margin-top:8px}
.docs.has-otp{max-width:1280px;grid-template-columns:210px minmax(0,720px) 200px;justify-content:center;gap:48px}
.otp{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);align-self:start;max-height:calc(100vh - env(safe-area-inset-top,0px) - 112px);overflow-y:auto;overscroll-behavior:contain;font-size:14.5px;line-height:1.4;scrollbar-width:thin}
.otp-t{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 14px 2px}
.otp-l{display:flex;flex-direction:column;border-left:2px solid var(--line)}
.otp a{display:block;margin-left:-2px;padding:6px 8px 6px 14px;border-left:2px solid transparent;color:var(--muted);overflow-wrap:anywhere;transition:color .15s}
.otp a:hover{color:var(--ink)}
.otp a.g{color:var(--ink);font-weight:500;margin-top:8px}
.otp a.g:first-child{margin-top:0}
.otp a.on{color:var(--ink);border-left-color:var(--gold)}
@media (max-width:1100px){
  .docs.has-otp{grid-template-columns:210px minmax(0,1fr);max-width:1040px;gap:56px}
  .otp{display:none}
}
@media (max-width:820px){.docs.has-otp{grid-template-columns:minmax(0,1fr);max-width:none;gap:28px}}
.side .sub{padding-left:26px;font-size:14.5px}
@media (max-width:820px){.side .sub{padding-left:14px}}

.ab-hero{display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:center;padding:80px 0 64px}
.eyebrow{display:inline-block;font-size:13.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);border:1px solid var(--gold);border-radius:999px;padding:4px 14px;margin-bottom:22px}
.ab-hero .mark{max-width:440px;margin-left:auto}
.ab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--surface);border-radius:14px;padding:26px 24px;border:1px solid transparent;transition:border-color .2s}
.card:hover{border-color:var(--gold)}
.card .ic{width:42px;height:42px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:16px;color:var(--gold-ink)}
.card .ic svg{width:22px;height:22px}
.card h3{margin:0 0 8px;font-size:18px;font-weight:500}
.card p{margin:0;color:var(--muted);font-size:16px;line-height:1.6}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:20px;align-items:start;padding:22px 0;border-bottom:1px solid var(--line);counter-increment:s}
.steps li:first-child{padding-top:0}
.steps li:last-child{border-bottom:0;padding-bottom:0}
.steps li::before{content:counter(s);width:40px;height:40px;border-radius:50%;background:var(--gold);color:#23242a;font-weight:600;display:grid;place-items:center}
.steps b{display:block;font-weight:500;font-size:18px;margin-bottom:2px}
.steps span{color:var(--muted)}
.author{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--surface);border-radius:18px;padding:34px 36px;border-left:4px solid var(--gold)}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--gold);color:#23242a;font-size:34px;font-weight:600;display:grid;place-items:center}
.author q{display:block;quotes:none;font-size:20px;line-height:1.55;margin-bottom:14px}
.author .who{font-size:15px;color:var(--muted)}
.author .who a{color:var(--ink);font-weight:500}
.closing{text-align:center;max-width:560px;margin:0 auto}
.closing .links{justify-content:center;margin-top:24px}
@media (max-width:820px){
  .ab-hero{grid-template-columns:1fr;padding:48px 0 40px;gap:28px}
  .ab-hero .mark{margin:0 auto;max-width:300px}
  .ab-hero .mark-box{order:-1}
  .ab-grid{grid-template-columns:1fr}
  .author{grid-template-columns:1fr;padding:26px 22px;gap:18px}
  .author q{font-size:18px}
}
@media (max-width:520px){.bar{gap:8px}.brand svg{height:18px}nav{gap:10px;font-size:13px}.theme{width:30px;height:30px}.theme svg{width:16px;height:16px}}
.soc{display:flex;align-items:center;gap:2px;margin-left:-10px}
.ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:color .2s,background .2s}
.ico svg{height:20px;width:auto;display:block}
.ico:hover{background:var(--surface);color:var(--gold-ink)}
@media (max-width:520px){.soc{margin-left:-6px;gap:0}.ico{width:28px;height:28px}.ico svg{height:17px}}
@media (max-width:400px){.wrap{padding:0 14px}.brand svg{height:16px}nav{gap:7px;font-size:12.5px}.soc{margin-left:-4px}.ico{width:24px;height:24px}.ico svg{height:15px}.theme{width:28px;height:28px}}
@media (max-width:820px){
  .wrap,.wrap.docs,.wrap.docs.has-otp{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .mark-box{display:none}
  .compare{grid-template-columns:minmax(0,1fr)}.panel{min-width:0}
  .hero,.ab-hero{padding-top:36px}
}
@media (max-width:400px){
  .bar{gap:6px}.brand svg{height:14px}
  nav{gap:5px;font-size:12px}
  .soc{margin-left:-2px}.ico{width:22px;height:22px}.ico svg{height:14px}
  .theme{width:26px;height:26px}.theme svg{width:14px;height:14px}
}
@media (max-width:520px){header .wrap{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}.bar{gap:4px}.brand svg{height:15px}nav{gap:10px;font-size:12.5px}.soc{gap:6px;margin-left:0}.ico{width:22px;height:22px}.ico svg{height:15px}.theme{width:26px;height:26px}}
@media (max-width:400px){header .wrap{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}.bar{gap:9px}nav{gap:9px;font-size:12px}.soc{gap:5px}.ico{width:20px;height:20px}.ico svg{height:14px}.brand svg{height:12px}.theme{width:24px;height:24px}.theme svg{width:13px;height:13px}}
@media (max-width:340px){.soc{display:none}}
</style>
</head>

<script type="text/plain" id="d:monads">
# What are Monads?

A monad is a wrapper to a generic type `T` which allows its manipulation but always returning a new wrapper.

Confusing? Let’s explain it.

In .NET we have nullable types. Once we want to admit a null value in a value type we can indicate that as follows:

```c#
int? x = null;
```

Simple. Right?

When we dig a bit to understand the code above we can see something interesting: a type called `Nullable<T>` with the following anatomy:

```c#
Nullable<int> x = null;
Console.WriteLine(x.HasValue);
//false
...
int? x = 10;
int? y = 20;
Console.WriteLine(x + y); //Same as x.Value + y.Value
//30
```

So we have a type acting as a wrapper to `int` allowing operations as it was really one and also admitting null as a value and returning another `Nullable<T>`.

It means that `Nullable<T>` is a monad? Actually not, but let’s explore a little more.

### More than a wrapper

Despite the fact that being a wrapper is a fundamental trait of a monad, it doesn’t completely describe what a monad is. Besides allowing the wrapping of some value a monad needs to be able to perform transformations which require a special function to that, the `Bind` method in our case.

Let’s see `Bind` in action with one of the most known monad, the `Option<T>` type (a.k.a. `Maybe` in some other languages). Let’s see the code:

```c#
var value = obj.Method() //returns 50
               .ToOption<int>()
               .Bind((v) => v > 0 ? "Higher than zero!" : "Lower or equals zero!")
               .Contains("Higher than zero!");
Console.WriteLine(value);
//true
```

Notice the function `Bind`. It operates on `Option<int>`, turning it on an `Option<string>` which in turn once chained to `Contains` returns a `bool`.

Although `Bind` is a requirement to define a monad it is totally possible to have several others to manipulate the wrapped value simplifying its use (as `Contains` above do).

### Flattening

[Mark Seemann](https://blog.ploeh.dk/2022/03/28/monads/#a342785804ef4d5ebb6e88cef8140432), on his series about monads says a monad is a functor you can flatten.

That means that every monad needs to be able to return a wrapped monad by a method called `Flatten`.

Let’s see another simple sample also with `Option<T>`:

```c#
var option = Option.Some<Option<int>>(obj.Method()); //returns Option<int> (10)
Console.Write(option.Flatten());
//10
```

The code above represents an `Option<T>` which could wrap another `Option<T>`, the `obj.Method()` return and to get it the `Flatten` method must be called, allowing so the inner value to be accessed (10 in this case).

Once we have this understanding, let’s install Moonad and know a bit more of each available monad.
</script>
<script type="text/plain" id="d:install">
# Installing Moonad

The project’s package can be found on [NuGet](https://www.nuget.org/packages/Moonad) and installed by your IDE or shell as following:

```shell
dotnet add package Moonad
```

or

```shell
PM> Install-Package Moonad
```

#### A Note on Null Reference Types

Since our main goal is to protect the user from `NullReferenceException` we strongly recommend the use of [Nullable Reference Types](https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/builtin-types/nullable-reference-types) on any project which uses this lib.

<script type="text/plain" id="d:choice">
# Choice

This monad, also known as `Either` in some other languages, allows to choose one of two (or more) inner types to return from a given method. It may sound weird at first but consider the following scenario: a given user can choose to log in by using an e-mail or an identifier. Whatever the choice once identified the user’s password will be required.

Let’s see how `Choice<T1, T2, T3>` can help.

```c#
public Option<User> GetUser(string input)
{
    Choice<Email, Identifier, InvalidKey> key = ExtractKey(input);
    return key switch
    {
        Email => users.GetByEmail(key),
        Identifier => users.GetByIdentifier(key),
        InvalidKey => Option.None<User>()
    }
}
```

The method `ExtractKey` will try to convert the input to one of the two valid identifiers and if it couldn’t it will return a type to express it. Then once with a valid key it will try to get the user identifier and perform the search for it in the database.

> **Info:** different from the other monads, which have a `Flatten` method, `Choice` doesn’t. Does it mean `Choice` isn’t a monad? Far from it! Here the `Flatten` method is replaced by an implicit operator to allow accessing the inner value as so as `Flatten` would do.

Here is the list of available `Choice` types:

- [Choice<T1, T2>](#/docs/choice/choicet2)
- [Choice<T1, T2, T3>](#/docs/choice/choicet3)
- [Choice<T1, T2, T3, T4>](#/docs/choice/choicet4)
- [Choice<T1, T2, T3, T4, T5>](#/docs/choice/choicet5)
</script>
<script type="text/plain" id="d:choice/choicet2">
# Choice<T1, T2>

Choice is a type which acts as a bag for one of two types. It’s not specialized to indicate an operation result, for this purpose please refer to [Result<TResult, TError>](#/docs/result/resultte).

#### Operators

##### Implicit T1

Allows the client to get the value of T1 when it was chosen.

```c#
Choice<int, string> choice = 12;
Console.WriteLine(choice);
//12
```

##### Implicit T2

Allows the client to get the value of T2 when it was chosen.

```c#
Choice<int, string> choice = "Twelve";
Console.WriteLine(choice);
//Twelve
```

<script type="text/plain" id="d:result">
# Result

This type represents a result from an operation. It’s usually confused with `Choice<T1, T2>` because both can return two types in some occasions but `Result` has distinct traits to indicate if an operation was successful (`IsOk`) or not (`IsError`), something that would demand a pattern matching from choice.

Result is advisable when a given method needs to indicate if its operation was successful, as calculus, transformations or persisting. If the method must carry some object to detail the result of the operation (as the number of lines affected by a SQL instruction) `Result<TResult, TError>` is the right tool for the job, if you just want to know what type of error occurred in a failed operation `Result<TError>` is the one, otherwise just `Result` is needed.

An interesting detail is that `Result` and `Result<TError>` can be used to avoid exceptions on `void` methods. So in case an exception is thrown in a given method, as an attempt to persist some data, it can be replaced by a `Result` / `Result<TError>` instance and let the exception to be handled by the method itself preventing the stack returning.

At the same time `Result<TResult, TError>` can be used to return domain meaningful error types avoiding application exceptions.

Let’s see some samples:

##### Sample 1 - Trying to persist a user in the database

```c#
public Result PersistUser(User user)
{
    try
    {
        //SQL...
        return true;
    }
    catch(Exception exc)
    {
        //Logs, metrics etc...
        return false;
    }
}
```

##### Sample 2 - Trying to create a User instance

```c#
public interface IUserError {}
public struct AlreadyExistingEmailError : IUserError {}
public struct AlreadyExistingIdentifierError : IUserError {}
...
public Result<User, IUserError> Create(Email email, Identifier identifier, Password password)
{
    //If Email is already in use
    return new AlreadyExistingEmailError();
    //If Identifier is already in use
    return new AlreadyExistingIdentifierError();
}
...
public IActionResult Create(CreateUserRequest request)
{
    var result = UserService.Create(email, cpf, password);
    if(result)
        return Created(string.Empty, result);

    var conflict = result switch
    {
        AlreadyExistingEmailError => "E-mail already in use.",
        AlreadyExistingIdentifierError => "Identifier already in use."
    }

    return Conflict(conflict);
}
```

##### Sample 3 - Trying to transfer funds between accounts

```c#
public interface ITransferError {}
public struct InsufficientFundsError : ITransferError {}
public struct InactiveAccountError : ITransferError {}
...
public Result<ITransferError> Transfer(Money amount, Account source, Account target)
{
    if(source.HasInsufficientFunds(amount))
        return new InsufficientFundsError();

    if(target.IsInactive)
        return new InactiveAccountError();
    ...

    return true;
}
```

You can see the details of the `Result` types’ capabilities below:

- [Result](#/docs/result/result)
- [Result<TResult, TError>](#/docs/result/resultte)
- [Result<TError>](#/docs/result/resulte)
</script>
<script type="text/plain" id="d:result/result">
# Result

Result is a simple indicator that a process ended and can indicate success or error. It’s an alternative to boolean returns to avoid primitive obsession.

#### Operators

##### Implicit bool

Indicates the success or failure by a boolean value.

```c#
Result result = false;
Console.WriteLine(result);
//false
```

#### Properties

##### IsOk

Indicates if the operation was executed successfully.

```c#
var result = obj.Method(); //returns Ok
Console.WriteLine(result.IsOk);
//true
```

##### IsError

Indicates if the operation was not executed successfully.

```c#
var result = obj.Method(); //returns Error
Console.WriteLine(result.IsError);
//true
```

#### Methods

##### Ok

Creates a Result instance representing a success.

```c#
var result = Result.Ok();
Console.WriteLine(result);
//true
```

##### Error

Creates a Result instance representing an error.

```c#
var result = Result.Error();
Console.WriteLine(result);
//false
```
</script>
<script type="text/plain" id="d:result/resultte">
# Result<TResult, TError>

This is a type that indicates success or error in a given operation, it also can hold the expected result for the operation or an error describing what was wrong.

#### Operators

##### Implicit Result<TResult, TError> (TResult)

Allows the client to set the TResult value to a Result.

```c#
Result<int, IError> result = 1;
Console.WriteLine(result);
//1
```

##### Implicit Result<TResult, TError> (TError)

Allows the client to set the TError value to a Result.

```c#
Result<int, IError> result = new CustomError("Error");
Console.WriteLine(result);
//"Error"
```

##### Implicit TResult

Allows the client to get the TResult value from a Result.

```c#
Result<int, IError> result = 1;
Console.WriteLine(result);
//1
```

##### Implicit TError

Allows the client to get the TError value from a Result.

```c#
Result<int, IError> result = new CustomError("Error");
Console.WriteLine(result);
//"Error"
```

##### Implicit bool

Allows the client to know if a Result is Ok or an Error.

```c#
Result<int, IError> result = new CustomError("Error");
if(result)
    Console.WriteLine("Ok");
else
    Console.WriteLine("Error");
//"Error"
```

#### Properties

##### IsOk

Indicates if the operation was executed successfully.

```c#
var result = obj.Method(); //returns Ok
Console.WriteLine(result.IsOk);
//true
```

##### IsError

Indicates if the operation was not executed successfully.

```c#
var result = obj.Method(); //returns Error
Console.WriteLine(result.IsError);
//true
```

##### ResultValue

Returns `TResult` if Ok or throws a `ResultValueException` if Error.

```c#
Result<int, IError> result = obj.Method(); //returns 1
Console.WriteLine(result.ResultValue);
//1
```

##### ErrorValue

Returns `TError` if Error or throws a `ErrorValueException` if OK.

```c#
Result<int, IError> result = obj.Method(); //returns new CustomError("Error")
Console.WriteLine(result.ErrorValue);
//"Error"
```

#### Methods

##### Bind<U> (Func<TResult, Result<U, TError>>)

Executes a given function over a Result, taking its `TResult`, to return a `Result<U, TError>`.

```c#
Result<int, IError> result = 1;
Result<string, IError> bound = result.Bind((r) => r > 0 ? "Higher" : "Equal or Lower");
Console.Write(bound);
//"Higher"
```

##### Contains (TResult)

Verify if another Result is Ok and equals a given Result. If so returns `true` otherwise returns `false`.

```c#
Result<int, IError> result1 = 1;
Result<int, IError> result2 = 1;
Console.Write(result1.Contains(result2));
//"true"
```

##### Count

Verify if a Result is Ok. If so returns `1` otherwise returns `0`.

```c#
Result<bool, IError> result = true;
Console.Write(result.Count(result));
//1
```

##### DefaultValue (TResult)

Returns `TResult` from a Result if it is Ok, otherwise returns the given default value.

```c#
Result<int, IError> result = new CustomError("Error");
Console.Write(result.DefaultValue(25));
//25
```

##### DefaultWith (Func<TError, TResult>)

Returns `TResult` from a Result if it is Ok, otherwise returns the result of the given function that takes `TError`.

```c#
Result<int, IError> result = new CustomError("Error");
Console.Write(result.DefaultWith((e) => $"Result: {e}"));
//Result: Error
```

##### Exists (Func<TResult, bool>)

Verify if `TResult` matches a given predicate and returns its result if so, or `false` if Result is not Ok.

```c#
Result<int, IError> result = 1;
Console.Write(result.Exists((r) => r > 0));
//true
```

##### Fold (Func<TState, TResult, TState>, TState)

Updates and returns `TState` by the given function if Result is Ok, otherwise returns `TState`.

```c#
Result<int, IError> result = 1;
Console.Write(result.Fold((s, r) => s + r, 10));
//11
```

##### FoldBack (Func<TResult, TState, TState>, TState)

As Fold but inverting `TResult` and `TState` as the given function parameters order.

```c#
Result<int, IError> result = 1;
Console.Write(result.FoldBack((r, s) => s + r, 10));
//11
```

##### ForAll (Func<TResult, bool>)

Verifies if Result is `TError`. If so returns `true`, otherwise applies the given function to `TResult`.

```c#
Result<int, IError> result = 1;
Console.Write(result.ForAll((r) => r > 10));
//false
```

##### Iter (Action<TResult>)

Executes the given action if Result is Ok.

```c#
Result<int, IError> result = 1;
result.Iter(() => Console.Write("It's ok!"));
//It's ok!
```

##### Map<U> (Func<TResult, Result<U, TError>>)

Produces a `Result<U, TError>`. If Result is OK returns the result of the given function, otherwise an instance of `Result<U, TError>` holding the original `TError`.

```c#
Result<int, IError> result = 1;
Console.Write(result.Map((r) => r > 0 ? true : false));
//true
```

##### MapError<U> (Func<TError, Result<TResult, U>>)

Produces a `Result<TResult, U>`. If Result is OK returns an instance of `Result<TResult, U>` holding the original `TResult`, otherwise the result of the given function.

```c#
Result<int, IError> result = new CustomError("Error");
Console.Write(result.MapError((e) => e == "Error" ? "Not good!" : "It's ok!"));
//"Not good!"
```

##### ToArray

Returns an array with `TResult` if Result is Ok, otherwise returns an empty one.

```c#
Result<int, IError> result = 1;
Console.Write(result.ToArray().Length);
//1
```

##### ToList

As ToArray but returns a generic list with `TResult`.

```c#
Result<int, IError> result = 1;
Console.Write(result.ToList().Count);
//1
```

##### ToOption

Returns an `Option<TResult>` with `TResult` if Result is Ok or a `Option.None<TResult>` if not.

```c#
Result<int, IError> result = new CustomError("Error");
Console.Write(result.ToOption());
//Option<TResult>.None
```

##### ToValueOption

As `ToOption` but returning an instance of `ValueOption<TResult>`.

```c#
Result<int, IError> result = new CustomError("Error");
Console.Write(result.ToValueOption());
//ValueOption<TResult>.None
```
</script>
<script type="text/plain" id="d:result/resulte">
# Result<TError>

This is a type that indicates success or error in a given operation, it also can hold an error describing what was wrong. It offers a way to emulate a void method that could return an Exception.

#### Operators

##### Implicit Result<TError> (TError)

Allows the client to set the TError value to a Result.

```c#
Result<IError> result = new CustomError("Error");
Console.WriteLine(result);
//"Error"
```

##### Implicit TError

Allows the client to get the TError value from a Result.

```c#
Result<IError> result = new CustomError("Error");
Console.WriteLine(result);
//"Error"
```

##### Implicit bool

Allows the client to know if a Result is Ok or an Error.

```c#
Result<IError> result = new CustomError("Error");
if(result)
    Console.WriteLine("Ok");
else
    Console.WriteLine(result.ErrorValue);
//"Error"
```

#### Properties

##### IsOk

Indicates if the operation was executed successfully.

```c#
var result = obj.Method(); //returns Result<TError> (Ok)
Console.WriteLine(result.IsOk);
//true
```

##### IsError

Indicates if the operation was not executed successfully.

```c#
var result = obj.Method(); //returns Result<TError> (Error);
Console.WriteLine(result.IsError);
//true
```

##### ErrorValue

Returns `TError` if Error or throws a `ErrorValueException` if OK.

```c#
Result<IError> result = obj.Method(); //returns new CustomError("Error")
Console.WriteLine(result.ErrorValue);
//"Error"
```
</script>
<script type="text/plain" id="d:option">
# Option

`Option<T>` is a *sui generis* monad for representing the presence or absence of a value. When it wraps a value it becomes a `Some` type and when not a `None` type.

It allows `Option<T>` to deal with the `NullReferenceException` and it’s fundamental to avoid this kind of exception coming from our own code. `NullReferenceException` is a so serious issue that Microsoft included the concept of `Nullable Reference Types` to deal with it.

Let’s see how it works. When dealing with a 3rd party library a given method can return null, e.g. an `int?`. To avoid any concern about a potential null and return the following code could be implemented:

```c#
public Option<int> MyMethod(Whatever obj)
{
    Option<int> value = obj.Method().ToOption(); //returns null
    //value is Option<int>.None
    return value;
}

public Option<int> MyMethod(Whatever obj)
{
    Option<int> value = obj.Method().ToOption(); //returns 10
    //value is Option<int>.Some (10)
    return value;
}
```

- [Option<T>](#/docs/option/option)

> **Info:** there is a value type version of `Option<T>` called [ValueOption<T>](#/docs/value-option). It’s especially useful when dealing with high-performance scenarios.
</script>
<script type="text/plain" id="d:option/option">
# Option<T>

This is a type to represent the presence or absence of a `T` value. If `T` is null it would be transformed in `None` and, if not, will be returned as `Some<T>`.

#### Operators

##### Implicit Option<T> (T?)

Allows the client to set the T value to an Option.

```c#
Option<int> option = 1;
//Some<int> 1

Option<int> option = null;
//None
```

##### Implicit T

Allows the client to get the T value from an Option.

```c#
Option<int> option = 1;
Console.Write(option);
//1
```

##### Implicit bool

Allows the client to know if an Option is `Some` (`true`) or `None` (`false`).

```c#
Option<int> option = 1;
if(option)
    Console.WriteLine("Some");
else
    Console.WriteLine("None");
//"Some"
```

#### Properties

##### IsSome

Indicates if an Option is Some, holding a T.

```c#
Option<int> option = 1;
Console.WriteLine(option.IsSome);
//true
```

##### IsNone

Indicates if an Option is None, holding no value.

```c#
Option<int> option = Option.None<int>();
Console.WriteLine(option.IsNone);
//true
```

#### Methods

##### Bind<TResult> (Func<T, Option<TResult>>)

Executes a given function over an Option, taking its `T` value, and returning an `Option<TResult>`.

```c#
Option<int> option = 1;
Option<string> bound = option.Bind((r) => r > 0 ? "Higher" : "Equal or Lower");
//Some ("Higher")
```

##### Contains (T)

Verify if an Option is `Some` and it’s `T` is equal to a given `T`. If so returns `true` otherwise returns `false`.

```c#
Option<int> option1 = 1;
Option<int> option2 = Option.None<int>();
Console.Write(option1.Contains(option2));
//false
```

##### Count

Verify if an Option is `Some`. If so returns `1` otherwise returns `0`.

```c#
Option<bool> option = true;
Console.Write(option.Count());
//1
```

##### DefaultValue (T)

Returns `T` from an Option if it is `Some`, otherwise returns the given default value.

```c#
var option = Option.None<int>();
Console.Write(option.DefaultValue(25));
//25
```

##### DefaultWith (Func<T>)

Returns `T` from an Option if it is `Some`, otherwise returns the result of the given function.

```c#
Option<int> option = Option.None<int>();
Console.Write(option.DefaultWith(() => 25));
//25
```

##### Exists (Func<T, bool>)

Verify if `T` matches a given predicate and returns `true` if so or `false` if not or Option is `None`.

```c#
Option<int> option = 1;
Console.Write(option.Exists((s) => s > 0));
//true
```

##### Filter (Func<Option<T>, bool>)

Return the Option itself if its `None` or the predicate is `true`, otherwise returns `None`.

```c#
Option<int> option = 1;
var result = option.Filter((o) => o > 0);
//Some (1)
```

##### Flaten (Option<Option<T>>)

Returns `T` of the inner Option instance if it is `Some`, otherwise `None`.

```c#
Option<Option<string>> option = Option.Some<Option<string>>("Option!");
Console.Write(option.Flaten());
//"Option!"
```

##### Fold (Func<TState, T, TState>, TState)

Updates and returns `TState` by the given function if Option is `Some`, otherwise returns `TState`.

```c#
Option<int> option = 1;
Console.Write(option.Fold((s, t) => s + t, 10));
//11
```

##### FoldBack (Func<T, TState, TState>, TState)

As Fold but inverting `T` and `TState` as the given function parameters order.

```c#
Option<int> option = 1;
Console.Write(option.FoldBack((r, s) => s + r, 10));
//11
```

##### ForAll (Func<T, bool>)

Verifies if Option is `None`. If so returns `true`, otherwise applies the given function to `T`.

```c#
Option<int> option = 1;
Console.Write(option.ForAll((r) => r > 10));
//false
```

##### Get

Returns the `T` if `Some` or throws an exception if `None`.

```c#
Option<int> option = Option.None<int>();
Console.Write(option.Get());
//throws OptionException;
```

##### Iter (Action<T>)

Executes the given action if Option is `Some`.

```c#
Option<int> option = 1;
option.Iter(() => Console.Write("It's ok!"));
//"It's ok!"
```

##### Map (Func<T, Option<TResult>>)

Returns the Option itself if `None` or the result of the given function applied to `T` as an `Option<TResult>`.

```c#
Option<int> option = 1;
Console.Write(option.Map((r) => r > 0 ? true : false));
//true
```

##### Map2 (Func<Option<T>>, Func<T, T, Option<T>>)

Returns `None` if the Option itself and the first parameter are `None`, otherwise returns the result of the given function with the Option itself and the first parameter as an `Option<TResult>`.

```c#
Option<int> option1 = 1;
Option<int> option2 = 2;
Console.Write(option1.Map2((o1, o2) => o1 == o2 ? o1 : 0));
//0
```

##### Map3 (Func<Option<T>>, Func<Option<T>>, Func<T, T, T, Option<TResult>>)

Returns `None` if the Option itself and the first and second parameters are `None`, otherwise returns the result of the given function with the Option itself and the first and second parameters as an `Option<TResult>`.

```c#
Option<int> option1 = 1;
Option<int> option2 = 2;
Console.Write(option1.Map2((o1, o2) => o1 == o2 ? o1 : 0));
//0
```

##### Match (Action<T>, Action)

Executes the first action based on `T` if Option is `Some` or the second action if `None`.

```c#
Option<int> option = 1;
option.Match((t) => Console.Write(t), () => Console.Write("None"));
//1
```

##### OrElse (Option<T>)

Returns the Option itself if `Some` or the first parameter.

```c#
var option = Option.None<int>();
option.OrElse(2);
//Some (2)
```

##### OrElseWith (Func<Option<T>>)

Returns the Option itself if `Some` or the result of the given function.

```c#
var option = Option.None<int>();
option.OrElseWith(() => 25);
//Some (25)
```

##### ToArray

Returns an array with `T` if Option is `Some`, otherwise an empty one.

```c#
Option<int> option = 1;
Console.Write(option.ToArray().Length);
//1
```

##### ToList

As ToArray but returns a generic list with `T`.

```c#
Option<int> option = 1;
Console.Write(option.ToList().Count);
//1
```

##### ToOption

Returns `Some` if `T` is not `null`, or a `None` if so.

```c#
var myString = "Option!";
var option = myString.ToOption();
//Some ("Option!")
```
</script>

<script type="text/plain" id="d:value-option/value-option">
# ValueOption<T>

This is a type to represent the presence or absence of a `T` when it is a value type.

#### Operators

##### Implicit ValueOption<T> (T?)

Allows the client to set the T value to a ValueOption.

```c#
ValueOption<int> option = 1;
//option.IsSome = true

ValueOption<int> option = null;
//option.IsSome = false
```

##### Implicit T

Allows the client to get the T value from a ValueOption.

```c#
ValueOption<int> option = 1;
Console.Write(option);
//1
```

##### Implicit bool

Allows the client to know if a ValueOption contains value.

```c#
ValueOption<int> option = 1;
if(option)
    Console.WriteLine("Some");
else
    Console.WriteLine("None");
//"Some"
```

#### Properties

##### IsSome

Indicates if a ValueOption is Some, holding a T.

```c#
ValueOption<int> option = 1;
Console.WriteLine(option.IsSome);
//true
```

##### IsNone

Indicates if a ValueOption is None, holding no value.

```c#
ValueOption<int> option = ValueOption<int>.None();
Console.WriteLine(option.IsNone);
//true
```

#### Methods

##### static Some(T)

Returns an instance of ValueOption with `T` value.

```c#
var option = ValueOption.Some(10);
Console.Write(option);
//10
```

##### static None

Returns an instance of ValueOption with no value.

```c#
var option = ValueOption.None();
Console.Write(option);
//throw a ValueOptionException
```

##### Bind<TResult> (Func<T, ValueOption<TResult>>)

Executes a given function over a ValueOption, taking its `T` value, and returning a `ValueOption<TResult>`.

```c#
ValueOption<int> option = 1;
ValueOption<bool> bound = option.Bind((r) => r > 0 ? true : false);
Console.Write(bound);
//true
```

##### Contains (T)

Verify if a ValueOption is `Some` and it’s `T` is equal to a given `T`. If so returns `true` otherwise returns `false`.

```c#
ValueOption<int> option1 = 1;
ValueOption<int> option2 = ValueOption<int>.None();
Console.Write(option1.Contains(option2));
//false
```

##### Count

Verify if a ValueOption is `Some`. If so returns `1` otherwise returns `0`.

```c#
ValueOption<bool> option = true;
Console.Write(option.Count());
//1
```

##### DefaultValue (T)

Returns `T` from a ValueOption if it is `Some`, otherwise returns the given default value.

```c#
var option = ValueOption<int>.None();
Console.Write(option.DefaultValue(25));
//25
```

##### DefaultWith (Func<T>)

Returns `T` from a ValueOption if it is `Some`, otherwise returns the result of the given function.

```c#
ValueOption<int> option = ValueOption<int>.None();
Console.Write(option.DefaultWith(() => 25));
//25
```

##### Exists (Func<T, bool>)

Verify if `T` matches a given predicate and returns `true` if so or `false` if not or ValueOption is `None`.

```c#
ValueOption<int> option = 1;
Console.Write(option.Exists((v) => v > 0));
//true
```

##### Filter (Func<ValueOption<T>, bool>)

Return the ValueOption itself if its `None` or the predicate is `true`, otherwise returns `None`.

```c#
ValueOption<int> option = 1;
var result = option.Filter((o) => o > 0);
//1
```

##### Flaten (ValueOption<ValueOption<T>>)

Returns `T` of the inner ValueOption instance if it is `Some`, otherwise `None`.

```c#
ValueOption<ValueOption<bool>> option = ValueOption<ValueOption<bool>>.Some(true);
Console.Write(option.Flaten());
//true
```

##### Fold (Func<TState, T, TState>, TState)

Updates and returns `TState` by the given function if ValueOption is `Some`, otherwise returns `TState`.

```c#
ValueOption<int> option = 1;
Console.Write(option.Fold((s, t) => s + t, 10));
//11
```

##### FoldBack (Func<T, TState, TState>, TState)

As Fold but inverting `T` and `TState` as the given function parameters order.

```c#
ValueOption<int> option = 1;
Console.Write(option.FoldBack((r, s) => s + r, 10));
//11
```

##### ForAll (Func<T, bool>)

Verifies if ValueOption is `None`. If so returns `true`, otherwise applies the given function to `T`.

```c#
ValueOption<int> option = 1;
Console.Write(option.ForAll((r) => r > 10));
//false
```

##### Get

Returns the `T` if `Some` or throws an exception if `None`.

```c#
ValueOption<int> option = ValueOption<int>.None();
Console.Write(option.Get());
//throws ValueOptionException;
```

##### Iter (Action<T>)

Executes the given action if ValueOption is `Some`.

```c#
ValueOption<int> option = 1;
option.Iter(() => Console.Write("It's ok!"));
//"It's ok!"
```

##### Map (Func<T, ValueOption<T>>)

Returns the ValueOption itself if `None` or the result of the given function applied to `T`.

```c#
ValueOption<int> option = 1;
Console.Write(option.Map((r) => r > 0 ? true : false));
//true
```

##### Map2 (Func<ValueOption<T>>, Func<T, T, ValueOption<T>>)

Returns `None` if the ValueOption itself and the first parameter are `None`, otherwise returns the result of the given function with the ValueOption itself and the first parameter.

```c#
ValueOption<int> option1 = 1;
ValueOption<int> option2 = 2;
Console.Write(option1.Map2((o1, o2) => o1 == o2 ? o1 : 0));
//0
```

##### Match (Action<T>, Action)

Executes the first action based on `T` if ValueOption is `Some` or the second action if `None`.

```c#
ValueOption<int> option = 1;
option.Match((t) => Console.Write(t), () => Console.Write("None"));
//1
```

##### OrElse (Option<T>)

Returns the ValueOption itself if `Some` or the first parameter.

```c#
var option = ValueOption<int>.None();
Console.Write(option.OrElse(2));
//2
```

##### OrElseWith (Func<Option<T>>)

Returns the ValueOption itself if `Some` or the result of the given function.

```c#
var option = ValueOption<int>.None();
Console.Write(option.OrElseWith(() => 25));
//25
```

##### ToArray

Returns an array with `T` if ValueOption is `Some`, otherwise an empty one.

```c#
ValueOption<int> option = 1;
Console.Write(option.ToArray().Length);
//1
```

##### ToList

As ToArray but returns a generic list with `T`.

```c#
ValueOption<int> option = 1;
Console.Write(option.ToList().Count);
//1
```

##### ToValueOption

Returns `Some` if `T` is not `null`, or a `None` if so.

```c#
var myString = "Option!";
var option = myString.ToValueOption();
//Some ("Option!")
```

# State

The `State<T, S>` is a functional abstraction that encapsulates computations that depend on and modify state. It allows you to work with state in an immutable and composable way, avoiding the explicit passing of state between functions.

```csharp
var state = new State<int, int>(s => (s + 1, s + 2));
var mapped = state.Map(x => x * 2, state);
var (value, newState) = mapped.Run(3);
// value: 8 ((3 + 1) * 2)
// newState: 5 (3 + 2)
```

- [State<T, S>](#/docs/state/state)
</script>
<script type="text/plain" id="d:state/state">
# State<T,S>

The `State<T, S>` monad represents a stateful computation that takes an initial state of type `S`, performs some computation, and returns a value of type `T` along with a new state of type `S`.

#### Operators

##### Implicit State<T, S>(S)

Implicitly converts a value to a State that returns that value without changing the state.

```csharp
// Implicit conversion
State<int, string> state = "hello";
var (value, newState) = state.Run(42);
// value: "hello"
// newState: 42 (unchanged)

// Also works with value types
State<string, int> numState = 100;
var (num, strState) = numState.Run("initial");
// num: 100
// strState: "initial"
```

#### Properties

##### Function

```csharp
public Func<S, (T Value, S State)> Function { get; private set; }
```

The underlying function that performs the stateful computation. Takes an initial state and returns a tuple containing:

- `Value` - The computed result of type `T`
- `State` - The new state of type `S`

```csharp
var state = new State<int, string>(s => ($"value:{s}", s + 1));
var result = state.Function(10);
// result.Value: "value:10"
// result.State: 11
```

#### Methods

##### Eval

```csharp
public T Eval(S initial)
```

Executes the computation and returns only the value, discarding the final state.

**Parameters:**

- `initial` - The initial state to pass to the computation

**Returns:** The computed value of type `T`

**Example:**

```csharp
var state = new State<int, int>(s => (s * 2, s + 1));
var value = state.Eval(5);
// value: 10
// Final state (6) is discarded
```

##### Exec

```csharp
public S Exec(S initial)
```

Executes the computation and returns only the final state, discarding the value.

**Parameters:**

- `initial` - The initial state to pass to the computation

**Returns:** The final state of type `S`

**Example:**

```csharp
var state = new State<int, int>(s => (s * 2, s + 1));
var finalState = state.Exec(5);
// finalState: 6
// Value (10) is discarded
```

##### Run

```csharp
public (T, S) Run(S initial)
```

Executes the stateful computation with the given initial state and returns both the value and the new state.

**Parameters:**

- `initial` - The initial state to pass to the computation

**Returns:** A tuple containing the computed value and the new state

**Example:**

```csharp
var state = new State<int, int>(s => (s * 2, s + 1));
var (value, newState) = state.Run(5);
// value: 10 (5 * 2)
// newState: 6 (5 + 1)
```

#### Manipulation Methods

##### Get

```csharp
public State<S, S> Get()
```

Returns a State computation that produces the current state as its value without modifying the state.

**Returns:** A State that returns the current state as both value and state

**Example:**

```csharp
var getState = new State<int, int>(s => (s, s)).Get();
var (value, newState) = getState.Run(10);
// value: 10
// newState: 10
```

##### Gets

```csharp
public State<S, T> Gets(Func<S, T> f)
```

Returns a State that applies a function to the current state to produce a value, without modifying the state.

**Parameters:**

- `f` - A function that extracts or transforms the state into a value

**Returns:** A State that produces the transformed value

**Example:**

```csharp
var state = new State<int, int>(s => (s, s)).Gets(s => s * 2);
var (value, newState) = state.Run(5);
// value: 10 (5 * 2)
// newState: 5 (unchanged)

// Extracting a property from state
record GameState(int Score, int Lives);
var getScore = new State<GameState, int>(s => (0, s))
    .Gets(s => s.Score);
```

##### Modify

```csharp
public State<S, Unit> Modify(Func<S, S> f)
```

Returns a State that modifies the current state using the provided function, returning `Unit.Value`.

**Parameters:**

- `f` - A function that transforms the state

**Returns:** A State that produces `Unit.Value` and the modified state

**Example:**

```csharp
var modifyState = new State<int, int>(s => (s, s)).Modify(s => s + 5);
var (value, newState) = modifyState.Run(10);
// value: Unit.Value
// newState: 15 (10 + 5)

// Modifying complex state
record Counter(int Count);
var increment = new State<Counter, Unit>(s => (Unit.Value, s))
    .Modify(c => c with { Count = c.Count + 1 });
```

##### Put

```csharp
public State<S, Unit> Put(S newState)
```

Returns a State that replaces the current state with a new state, returning `Unit.Value`.

**Parameters:**

- `newState` - The new state to set

**Returns:** A State that produces `Unit.Value` and sets the new state

**Example:**

```csharp
var setState = new State<int, int>(s => (s, s)).Put(99);
var (value, newState) = setState.Run(10);
// value: Unit.Value
// newState: 99 (replaced from 10)
```

#### Transformation Methods

##### Lift

```csharp
public State<S, U> Lift<U>(Func<T, U> f)
```

Lifts a pure function into the State context. Equivalent to `Map(f, this)`.

**Parameters:**

- `f` - A pure function to lift

**Returns:** A new State with the lifted function applied

**Example:**

```csharp
var state = new State<int, int>(s => (s + 2, s + 3));
var lifted = state.Lift(x => x * 2);
var (value, newState) = lifted.Run(1);
// value: 6 ((1 + 2) * 2)
// newState: 4 (1 + 3)

// Lifting string operations
var strState = new State<int, string>(s => ($"Count: {s}", s + 1));
var upper = strState.Lift(s => s.ToUpper());
var (result, _) = upper.Run(5);
// result: "COUNT: 5"
```

##### Lift2

```csharp
public State<S, V> Lift2<U, V>(Func<T, U, V> f, State<S, T> x, State<S, U> y)
```

Lifts a binary function into the State context. Equivalent to `Map2(f, x, y)`.

**Parameters:**

- `f` - A binary function to lift
- `x` - The first State computation
- `y` - The second State computation

**Returns:** A State with the lifted function applied to both values

**Example:**

```csharp
var x = new State<int, int>(s => (s + 1, s + 2));
var y = new State<int, int>(s => (s * 2, s + 3));
var result = x.Lift2((a, b) => a * b, x, y);
var (value, newState) = result.Run(3);
// x: value=4, state=5
// y: value=10 (5*2), state=8 (5+3)
// final value: 40 (4*10), state: 8
```

##### Map

```csharp
public State<S, U> Map<U>(Func<T, U> f, State<S, T> state)
```

Transforms the value produced by a State computation while preserving the state threading.

**Parameters:**

- `f` - A function to transform the value
- `state` - The State computation to transform

**Returns:** A new State with the transformed value

**Example:**

```csharp
var state = new State<int, int>(s => (s + 1, s + 2));
var mapped = state.Map(x => x * 2, state);
var (value, newState) = mapped.Run(3);
// value: 8 ((3 + 1) * 2)
// newState: 5 (3 + 2)
```

##### Map2

```csharp
public State<S, V> Map2<U, V>(Func<T, U, V> f, State<S, T> x, State<S, U> y)
```

Combines two State computations using a binary function.

**Parameters:**

- `f` - A function that combines two values
- `x` - The first State computation
- `y` - The second State computation

**Returns:** A State that produces the combined value

**Example:**

```csharp
var x = new State<int, int>(s => (s + 1, s + 2));
var y = new State<int, int>(s => (s * 2, s + 3));
var result = x.Map2((a, b) => a + b, x, y);
var (value, newState) = result.Run(2);
// x: value=3, state=4
// y: value=8 (4*2), state=7 (4+3)
// final value: 11 (3+8), state: 7
```

##### Map3

```csharp
public State<S, W> Map3<U, V, W>(Func<T, U, V, W> f, State<S, T> x, State<S, U> y, State<S, V> z)
```

Combines three State computations using a ternary function.

**Parameters:**

- `f` - A function that combines three values
- `x` - The first State computation
- `y` - The second State computation
- `z` - The third State computation

**Returns:** A State that produces the combined value

**Example:**

```csharp
var x = new State<int, int>(s => (s + 1, s + 2));
var y = new State<int, int>(s => (s * 2, s + 3));
var z = new State<int, int>(s => (s - 1, s + 4));
var result = x.Map3((a, b, c) => a + b + c, x, y, z);
var (value, newState) = result.Run(2);
// x: value=3, state=4
// y: value=8, state=7
// z: value=6, state=11
// final value: 17 (3+8+6), state: 11
```

#### Monadic Operations

##### Apply

```csharp
public State<S, U> Apply<U>(State<S, Func<T, U>> sf)
```

Applies a function wrapped in a State to a value wrapped in a State, threading the state through both computations. This is the applicative functor operation.

**Parameters:**

- `sf` - A State containing a function

**Returns:** A State with the function applied to the value

**Example:**

```csharp
var sf = new State<int, Func<int, int>>(s => (x => x + s, s + 1));
var xv = new State<int, int>(s => (s * 2, s + 1));
var result = xv.Apply(sf);
var (value, newState) = result.Run(3);
// sf: func=(x => x+3), state=4
// xv: value=8 (4*2), state=5 (4+1)
// apply: value=11 (8+3), state=5
```

##### Bind

```csharp
public State<S, U> Bind<U>(Func<T, State<S, U>> f, State<S, T> state)
```

Chains stateful computations, threading the state through each computation. This is the fundamental monadic operation for State.

**Parameters:**

- `f` - A function that takes a value and returns a new State computation
- `state` - The initial State computation

**Returns:** A State that sequences both computations

**Example:**

```csharp
var state = new State<int, int>(s => (s + 1, s + 2));
State<int, int> next(int v) => new State<int, int>(s => (v * 3, s + v));
var bound = state.Bind(next, state);
var (value, newState) = bound.Run(1);
// state: value=2, state=3
// next: value=6 (2*3), state=5 (3+2)
```

##### Kleisli

```csharp
public Func<T, State<S, V>> Kleisli<U, V>(
    Func<T, State<S, U>> f,
    Func<U, State<S, V>> g)
```

Composes two State-producing functions using Kleisli composition. This creates a pipeline of stateful computations.

**Parameters:**

- `f` - The first State-producing function
- `g` - The second State-producing function

**Returns:** A composed function that applies both transformations

**Example:**

```csharp
State<int, int> f(int t) => new State<int, int>(s => (t + s, s + 1));
State<int, string> g(int u) => new State<int, string>(s => ($"{u}-{s}", s + u));
var k = new State<int, int>(s => (s, s)).Kleisli(f, g);
var result = k(5);
var (value, newState) = result.Run(3);
// f(5): value=8 (5+3), state=4 (3+1)
// g(8): value="8-4", state=12 (4+8)
```

#### Sequencing Methods

##### SequenceLeft

```csharp
public State<S, T> SequenceLeft<U>(State<S, T> x, State<S, U> y)
```

Executes two State computations in sequence, returning the result of the first computation with the final state from the second. Often represented as `<*` in functional languages.

**Parameters:**

- `x` - The first State computation (result returned)
- `y` - The second State computation (result discarded)

**Returns:** A State that produces the first computation’s value with the second’s state

**Example:**

```csharp
var x = new State<int, string>(s => ($"x{s}", s + 1));
var y = new State<int, int>(s => (s * 3, s + 2));
var result = x.SequenceLeft(x, y);
var (value, newState) = result.Run(2);
// x: value="x2", state=3
// y: value=9 (discarded), state=5 (3+2)
// final: value="x2", state=5
```

##### SequenceRight

```csharp
public State<S, U> SequenceRight<U>(State<S, T> x, State<S, U> y)
```

Executes two State computations in sequence, returning the result of the second computation. Often represented as `*>` in functional languages.

**Parameters:**

- `x` - The first State computation (result discarded)
- `y` - The second State computation (result returned)

**Returns:** A State that produces the second computation’s value

**Example:**

```csharp
var x = new State<int, int>(s => (s, s + 1));
var y = new State<int, int>(s => (s * 3, s + 2));
var result = y.SequenceRight(x, y);
var (value, newState) = result.Run(2);
// x: value=2 (discarded), state=3
// y: value=9 (3*3), state=5 (3+2)
```

##### Zip

```csharp
public State<S, (T, U)> Zip<U>(State<S, T> x, State<S, U> y)
```

Runs two State computations in sequence and returns their results as a tuple.

**Parameters:**

- `x` - The first State computation
- `y` - The second State computation

**Returns:** A State that produces a tuple of both values

**Example:**

```csharp
var x = new State<int, string>(s => ($"x{s}", s + 1));
var y = new State<int, int>(s => (s * 2, s + 3));
var result = x.Zip(x, y);
var ((a, b), newState) = result.Run(2);
// x: a="x2", state=3
// y: b=6 (3*2), state=6 (3+3)
// final: (a,b)=("x2",6), state=6
```

#### Control Flow Methods

##### Delay

```csharp
public State<S, T> Delay(Func<State<S, T>> body)
```

Defers the execution of a State computation until it is run. Useful for lazy evaluation or recursive computations.

**Parameters:**

- `body` - A function that produces the State computation

**Returns:** A State that will execute the body when run

**Example:**

```csharp
var executed = false;
State<int, int> body() => new State<int, int>(s => {
    executed = true;
    return (s + 10, s + 1);
});
var delayed = new State<int, int>(s => (s, s)).Delay(body);
// executed is still false here
var (value, newState) = delayed.Run(0);
// now executed is true
// value: 10, newState: 1
```

##### Throw

```csharp
public State<S, T> Throw(Exception ex)
```

Returns a State that throws the specified exception when executed.

**Parameters:**

- `ex` - The exception to throw

**Returns:** A State that throws the exception

**Example:**

```csharp
var ex = new InvalidOperationException("Something went wrong");
var state = new State<int, int>(s => (s, s)).Throw(ex);
// Throws InvalidOperationException when Run is called
try {
    state.Run(0);
} catch (InvalidOperationException e) {
    Console.WriteLine(e.Message); // "Something went wrong"
}
```

##### TryFinally

```csharp
public State<S, T> TryFinally(State<S, T> body, Action compensation)
```

Executes a State computation and ensures the compensation action runs afterward, similar to a `finally` block.

**Parameters:**

- `body` - The State computation to execute
- `compensation` - An action to run after the computation (success or failure)

**Returns:** A State that ensures cleanup

**Example:**

```csharp
var called = false;
var body = new State<int, int>(s => (s + 1, s + 2));
var wrapped = body.TryFinally(body, () => called = true);
var (value, newState) = wrapped.Run(1);
// value: 2, newState: 3
// called is now true
```

##### TryWith

```csharp
public State<S, T> TryWith(State<S, T> body, Func<Exception, State<S, T>> handler)
```

Executes a State computation and handles any exceptions with the provided handler function.

**Parameters:**

- `body` - The State computation to execute
- `handler` - A function that handles exceptions and returns a recovery State

**Returns:** A State that handles exceptions

**Example:**

```csharp
var exBody = new State<int, int>(_ => throw new InvalidOperationException("Error"));
var handled = exBody.TryWith(
    exBody,
    ex => new State<int, int>(s => (999, s + 1))
);
var (value, newState) = handled.Run(0);
// value: 999 (from handler)
// newState: 1
```

##### Using

```csharp
public State<S, T> Using<R>(R resource, Func<R, State<S, T>> body)
    where R : IDisposable
```

Executes a State computation with a disposable resource and ensures the resource is disposed afterward.

**Parameters:**

- `resource` - The disposable resource to use
- `body` - A function that uses the resource to produce a State

**Returns:** A State that ensures resource disposal

**Example:**

```csharp
class FileResource : IDisposable {
    public bool Disposed { get; private set; }
    public void Dispose() => Disposed = true;
}

var resource = new FileResource();
var state = new State<int, int>(s => (s + 1, s + 2));
var wrapped = state.Using(resource, _ => state);
var (value, newState) = wrapped.Run(3);
// value: 4, newState: 5
// resource.Disposed is now true
```

#### LINQ Support

The State monad supports LINQ query syntax through extension methods, enabling declarative and readable stateful computations.

##### Select

```csharp
public static State<S, U> Select<S, T, U>(
    this State<S, T> state,
    Func<T, U> selector)
```

Projects the value of a State computation. Enables `select` in LINQ queries.

**Parameters:**

- `state` - The State to transform
- `selector` - A function to transform the value

**Returns:** A State with the transformed value

**Example:**

```csharp
var state = new State<int, int>(s => (s + 1, s + 2));
var projected = state.Select(x => x * 3);
var (value, newState) = projected.Run(5);
// value: 18 ((5+1)*3)
// newState: 7 (5+2)

// Using LINQ syntax
var query = from x in state
            select x * 3;
```

##### SelectMany

```csharp
public static State<S, U> SelectMany<S, T, U>(
    this State<S, T> state,
    Func<T, State<S, U>> binder)
```

Binds State computations. Enables `from ... from` in LINQ queries.

**Parameters:**

- `state` - The initial State
- `binder` - A function that produces the next State

**Returns:** A State that sequences both computations

**Example:**

```csharp
var state = new State<int, int>(s => (s + 2, s + 3));
State<int, string> binder(int x) => new(s => ($"{x}-{s}", s + x));
var bound = state.SelectMany(binder);
var (value, newState) = bound.Run(4);
// value: "6-7", newState: 13

// Using LINQ syntax
var query = from x in state
            from y in binder(x)
            select y;
```

##### SelectMany (with projection)

```csharp
public static State<S, V> SelectMany<S, T, U, V>(
    this State<S, T> state,
    Func<T, State<S, U>> binder,
    Func<T, U, V> projector)
```

Binds State computations with a final projection. Required for full LINQ query syntax support with multiple `from` clauses.

**Parameters:**

- `state` - The initial State
- `binder` - A function that produces the next State
- `projector` - A function that combines both values

**Returns:** A State with the projected result

**Example:**

```csharp
var state = new State<int, int>(s => (s + 1, s + 2));

var query = from x in state
            from y in new State<int, int>(s => (s * 2, s + 1))
            select x + y;

var (value, newState) = query.Run(3);
// x: 4, state: 5
// y: 10, state: 6
// value: 14 (4+10), newState: 6
```

##### Where

```csharp
public static State<S, T> Where<S, T>(
    this State<S, T> state,
    Func<T, bool> predicate)
```

Filters the value of a State computation. Enables `where` in LINQ queries. Throws an `InvalidOperationException` if the predicate fails.

**Parameters:**

- `state` - The State to filter
- `predicate` - A function that tests the value

**Returns:** A State that validates the predicate

**Example:**

```csharp
var state = new State<int, int>(s => (s * 2, s + 1));
var filtered = state.Where(v => v % 2 == 0);
var (value, newState) = filtered.Run(3);
// value: 6, newState: 4

// This will throw
var failing = state.Where(v => v % 2 != 0);
// Throws InvalidOperationException when run with even input

// Using LINQ syntax
var query = from x in state
            where x > 10
            select x;
```

using Moonad;

// Define counter operations
State<int, Unit> Increment() =>
    new State<int, Unit>(count => (Unit.Value, count + 1));

State<int, Unit> Decrement() =>
    new State<int, Unit>(count => (Unit.Value, count - 1));

State<int, int> GetCount() =>
    new State<int, int>(count => (count, count));

// Compose operations
var computation =
    from _ in Increment()
    from __ in Increment()
    from ___ in Increment()
    from count in GetCount()

##### Example 2: Stack Operations

using Moonad;
using System.Collections.Generic;

State<Stack<int>, Unit> Push(int value) =>
    new State<Stack<int>, Unit>(stack => {
        var newStack = new Stack<int>(stack);
        newStack.Push(value);
        return (Unit.Value, newStack);
    });

State<Stack<int>, int> Pop() =>
    new State<Stack<int>, int>(stack => {
        var newStack = new Stack<int>(stack);
        var value = newStack.Pop();
        return (value, newStack);
    });

    from _ in Push(10)
    from __ in Push(20)
    from ___ in Push(30)
    from top in Pop()
    from second in Peek()
    select (top, second);

Console.WriteLine($"Popped: {topValue}, Peek: {secondValue}");
// Output: Popped: 30, Peek: 20
```

record GameState(int Score, int Lives, int Level);

##### Example 6: Parser State

```csharp
using Moonad;

record ParserState(string Input, int Position);

State<ParserState, char> ReadChar() =>
    new State<ParserState, char>(state => {
        if (state.Position >= state.Input.Length)
            throw new InvalidOperationException("End of input");

        var ch = state.Input[state.Position];
        var newState = state with { Position = state.Position + 1 };
        return (ch, newState);
    });

State<ParserState, string> ReadWhile(Func<char, bool> predicate) =>
    new State<ParserState, string>(state => {
        int start = state.Position;
        int pos = start;

        while (pos < state.Input.Length && predicate(state.Input[pos]))
            pos++;

        var result = state.Input.Substring(start, pos - start);
        var newState = state with { Position = pos };
        return (result, newState);
    });

State<ParserState, int> GetPosition() =>
    new State<ParserState, int>(state => (state.Position, state));

// Parse a simple expression
var parser =
    from word1 in ReadWhile(char.IsLetter)
    from _ in ReadWhile(char.IsWhiteSpace)
    from word2 in ReadWhile(char.IsLetter)
    from pos in GetPosition()
    select (word1, word2, pos);

var initialState = new ParserState("Hello World", 0);
var ((w1, w2, position), finalState) = parser.Run(initialState);

Console.WriteLine($"Parsed: '{w1}' and '{w2}' at position {position}");
// Output: Parsed: 'Hello' and 'World' at position 11
```

##### Example 7: Transaction Log

```csharp
using Moonad;
using System.Collections.Generic;

record Transaction(string Type, decimal Amount, DateTime Timestamp);
record Account(decimal Balance, List<Transaction> History);

State<Account, Unit> Deposit(decimal amount) =>
    new State<Account, Unit>(account => {
        var transaction = new Transaction("Deposit", amount, DateTime.Now);
        var newHistory = new List<Transaction>(account.History) { transaction };
        return (Unit.Value, account with {
            Balance = account.Balance + amount,
            History = newHistory
        });
    });

State<Account, Unit> Withdraw(decimal amount) =>
    new State<Account, Unit>(account => {
        if (account.Balance < amount)
            throw new InvalidOperationException("Insufficient funds");

        var transaction = new Transaction("Withdrawal", amount, DateTime.Now);
        var newHistory = new List<Transaction>(account.History) { transaction };
        return (Unit.Value, account with {
            Balance = account.Balance - amount,
            History = newHistory
        });
    });

State<Account, decimal> GetBalance() =>
    new State<Account, decimal>(account => (account.Balance, account));

State<Account, int> GetTransactionCount() =>
    new State<Account, int>(account => (account.History.Count, account));

// Perform transactions
var transactions =
    from _ in Deposit(1000m)
    from __ in Withdraw(200m)
    from ___ in Deposit(500m)
    from ____ in Withdraw(150m)
    from balance in GetBalance()
    from count in GetTransactionCount()
    select (balance, count);

var initialAccount = new Account(0m, new List<Transaction>());
var ((finalBalance, txCount), finalAccount) = transactions.Run(initialAccount);

Console.WriteLine($"Final Balance: ${finalBalance}");
Console.WriteLine($"Transactions: {txCount}");
// Output:
// Final Balance: $1150
// Transactions: 4
```

#### Best Practices

##### 1. Keep State Pure and Immutable

Always use immutable state types and pure transformation functions:

```csharp
// Good: Immutable record
record GameState(int Score, int Level);

State<GameState, Unit> AddScore(int points) =>
    new State<GameState, Unit>(s =>
        (Unit.Value, s with { Score = s.Score + points }));

// Avoid: Mutable state
class MutableState {
    public int Score { get; set; }
}
```

##### 2. Use LINQ Query Syntax for Readability

LINQ syntax makes complex state computations more readable:

```csharp
// Good: Clear and declarative
var computation =
    from _ in Increment()
    from count in GetCount()
    where count > 0
    select count;

// Less readable: Nested Bind calls
var computation2 = Increment().Bind(
    _ => GetCount().Bind(
        count => ...));
```

##### 3. Compose Small Operations

Build complex operations from small, reusable pieces:

```csharp
// Small, focused operations
State<int, Unit> Increment() => /* ... */;
State<int, Unit> Double() => /* ... */;
State<int, int> GetValue() => /* ... */;

// Compose them
var complex =
    from _ in Increment()
    from __ in Double()
    from value in GetValue()
    select value;
```

##### 4. Handle Errors Gracefully

Use `TryWith` for error handling in stateful computations:

```csharp
State<Account, decimal> SafeWithdraw(decimal amount) =>
    new State<Account, Unit>(account => /* may throw */)
        .TryWith(
            Withdraw(amount),
            ex => new State<Account, decimal>(s => (s.Balance, s))
        );
```

##### 5. Minimize State Size

Keep state types focused and minimal:

```csharp
// Good: Focused state
record Counter(int Value);

// Avoid: Kitchen sink state
record EverythingState(
    int Counter,
    string Name,
    List<object> Items,
    Dictionary<string, object> Cache,
    // ... too much
);
```

##### 6. Use Gets for Read-Only Access

Use `Gets` when you only need to read from state without modification:

```csharp
// Read state property
State<GameState, int> GetScore() =>
    new State<GameState, int>(s => (0, s)).Gets(s => s.Score);

// Better than
State<GameState, int> GetScoreBad() =>
    new State<GameState, int>(s => (s.Score, s));
```

##### 7. Leverage Type Safety

Use specific types instead of primitives:

```csharp
// Good: Type-safe
record PlayerId(int Value);
record GameState(PlayerId CurrentPlayer);

// Avoid: Primitive obsession
record GameState(int CurrentPlayer);
```

##### 8. Document State Transitions

Make state transitions explicit and well-documented:

```csharp
/// <summary>
/// Transitions from Playing to GameOver if lives reach 0
/// </summary>

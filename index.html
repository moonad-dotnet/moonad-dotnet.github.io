<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonad — F# monads for C#</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf7; --surface:#f1f1ec; --ink:#23242a; --muted:#62646d; --line:#dcdcd4;
  --gold:#f2c200; --gold-ink:#7a5f00; --word:#2a2b31; --shadec:#fff; --code:#1f2026;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14151a; --surface:#1c1d24; --ink:#ececea; --muted:#9a9ca6; --line:#2c2d36;
    --gold:#fcd116; --gold-ink:#fcd116; --word:#ececea; --shadec:#000; --code:#e6e6e2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14151a; --surface:#1c1d24; --ink:#ececea; --muted:#9a9ca6; --line:#2c2d36;
  --gold:#fcd116; --gold-ink:#fcd116; --word:#ececea; --shadec:#000; --code:#e6e6e2; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 "Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand svg{height:24px;width:auto;display:block}
nav{display:flex;align-items:center;gap:22px;font-size:15px;color:var(--muted)}
nav a:hover,nav a.on{color:var(--ink)}
.theme{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme:hover{border-color:var(--gold)}
.theme svg{width:18px;height:18px}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme .sun{display:block}:root:not([data-theme="light"]) .theme .moon{display:none}}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding:88px 0 72px}
h1{font-size:clamp(34px,5vw,56px);line-height:1.1;font-weight:500;letter-spacing:-.02em;margin:0 0 22px}
.lead{color:var(--muted);font-size:19px;max-width:32em;margin:0 0 30px}
.cta,.links{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:12px 24px;border-radius:999px;font-weight:500;font-size:16px;border:1px solid var(--line);transition:border-color .2s}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#23242a}
.btn.primary:hover{filter:brightness(.96)}
.btn:not(.primary):hover{border-color:var(--ink)}
.mark{width:100%;height:auto;overflow:visible}
section{padding:68px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(24px,3.2vw,34px);font-weight:500;letter-spacing:-.01em;margin:0 0 14px;line-height:1.2}
.intro{color:var(--muted);max-width:36em;margin:0 0 36px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--surface);border-radius:14px;padding:22px 24px;border:1px solid transparent}
.panel.after{border-color:var(--gold)}
.panel h3{margin:0 0 14px;font-size:16px;font-weight:500;color:var(--muted)}
.panel.after h3{color:var(--gold-ink)}
pre,code{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
pre{margin:0;font-size:13.5px;line-height:1.75;color:var(--code);overflow-x:auto;white-space:pre}
.block{background:var(--surface);border-radius:12px;padding:18px 22px;margin:0 0 22px}
.types{margin:0;padding:0;list-style:none}
.types li a{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:12px 32px;padding:20px 0;border-bottom:1px solid var(--line);align-items:baseline}
.types li:first-child a{padding-top:0}
.types code{font-size:15px;color:var(--gold-ink);font-weight:500}
.types b{display:block;font-weight:500;margin-bottom:2px}
.types span{color:var(--muted);font-size:16px}
.types a:hover b{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.install{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border-radius:14px;padding:18px 22px;max-width:560px;margin-bottom:28px}
.install code{font-size:15px;overflow-x:auto;white-space:nowrap}
.copy{flex:none;font:500 14px "Outfit",sans-serif;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.copy:hover{border-color:var(--gold)}
.page{padding:64px 0 80px;max-width:720px}
.page h1{font-size:clamp(32px,4.4vw,46px)}
.page h2{margin-top:44px;font-size:24px}
.page p{margin:0 0 16px}
.page .lead{margin-bottom:12px}
.page code:not(pre code){font-size:.88em;background:var(--surface);padding:2px 6px;border-radius:5px}
.docs{display:grid;grid-template-columns:210px 1fr;gap:56px;padding:56px 0 80px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);align-self:start;display:flex;flex-direction:column;gap:2px;font-size:15.5px}
.side a{padding:7px 12px;border-left:2px solid var(--line);color:var(--muted)}
.side a:hover{color:var(--ink)}
.side a.on{color:var(--ink);border-left-color:var(--gold);font-weight:500}
.doc{max-width:700px;min-width:0}
.doc h1{font-size:clamp(30px,4vw,42px)}
.doc h2{margin-top:40px;font-size:23px}
.doc p{margin:0 0 16px}
.doc code:not(pre code){font-size:.88em;background:var(--surface);padding:2px 6px;border-radius:5px}
.pn{display:flex;justify-content:space-between;gap:16px;margin-top:56px;padding-top:22px;border-top:1px solid var(--line);font-size:15.5px}
.pn a{color:var(--muted)}.pn a:hover{color:var(--ink)}
footer{border-top:1px solid var(--line);padding:36px 0 48px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center}
footer .f{display:flex;gap:22px;flex-wrap:wrap}
footer a:hover{color:var(--ink)}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding:48px 0;gap:32px}
  .mark-box{order:-1;max-width:340px}
  .compare{grid-template-columns:1fr}
  .types li a{grid-template-columns:1fr;gap:6px}
  .docs{grid-template-columns:1fr;gap:28px;padding-top:32px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px}
  .side a{border:1px solid var(--line);border-radius:999px;white-space:nowrap;padding:6px 14px}
  .side a.on{border-color:var(--gold)}
  nav{gap:16px}
  section{padding:52px 0}
}
</style>
</head>

<script>
(function(){
  var app=document.getElementById('app'),root=document.documentElement;
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inl(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');}
  var DOCS=[
    {id:'monads',t:'What are monads?'},{id:'install',t:'Installing Moonad'},{id:'choice',t:'Choice'},
    {id:'result',t:'Result'},{id:'option',t:'Option'},{id:'value-option',t:'ValueOption'},{id:'state',t:'State'}
  ];
  var CONTENT={
    monads:{lead:'A monad is a wrapper type that carries context together with a value: it may be missing, it may have failed, it may be one of several shapes, or it may depend on some state.',
      body:[['h','The idea'],
      ['p','A method that returns a plain `User` says nothing about what can go wrong. It may return null, throw an exception, or do both on different days. The caller has to read the implementation, or the docs, to find out.'],
      ['p','A monad moves that knowledge into the type. When a method returns `Option<User>` or `Result<User, IError>`, the possibility of absence or failure is part of the signature, so it can’t be forgotten.'],
      ['c','// Without monads\nUser FindUser(int id);            // null?\nvoid Pay(Order order);            // throws?\n\n// With Moonad\nOption<User> FindUser(int id);\nResult<Receipt, PayError> Pay(Order order);\nChoice<Card, Pix, Boleto> Method();'],
      ['h','Why Moonad'],
      ['p','F# ships these types in its core library. Moonad takes the main ones from FSharp.Core and adapts them to C#, so C# developers can use the same tools and write safer applications with a smarter design. Its main goal is to protect you from `NullReferenceException`.'],
      ['h','What is included'],
      ['p','Moonad provides `Choice`, `Result`, `Option`, `ValueOption` and `State`. Each has its own page in this documentation.']]},
    install:{lead:'Moonad is distributed as a NuGet package. Add it with the tool you already use.',
      body:[['h','.NET CLI'],['c','dotnet add package Moonad'],
      ['h','Package Manager Console'],['c','PM> Install-Package Moonad'],
      ['h','Project file'],['c','<PackageReference Include="Moonad" Version="5.5.1" />'],
      ['p','Version 5.5.1 was the latest at the time of writing. Check the NuGet page for the current release.'],
      ['h','Compatibility'],
      ['p','Moonad targets .NET Standard 2.1, so it works on runtimes that support it, such as .NET Core 3.0 and later and .NET 5 and later.']]},
    choice:{lead:'A value that is exactly one of several possible types. In other ecosystems it is known as Either.',
      body:[['h','When to use it'],
      ['p','Use `Choice` when a method can legitimately answer with different types and the caller must handle each one. Moonad provides `Choice<T1, T2>` and versions with up to five types, down to `Choice<T1, T2, T3, T4, T5>`.'],
      ['h','Example'],
      ['p','Returning either an `int` or a `string` from the same method:'],
      ['c','public Choice<int, string> Choose(bool returnInt)\n{\n    if (returnInt)\n        return 42;\n\n    return "This is a Choice!";\n}'],
      ['p','Values convert to the choice implicitly, so each branch simply returns its own type.'],
      ['h','Available types'],
      ['p','`Choice<T1, T2>`, `Choice<T1, T2, T3>`, `Choice<T1, T2, T3, T4>` and `Choice<T1, T2, T3, T4, T5>`.']]},
    result:{lead:'The final state of a processing step: it succeeded or it failed, optionally carrying a value or an error.',
      body:[['h','When to use it'],
      ['p','Use `Result` for expected failures. The error becomes an explicit value that callers receive and handle, instead of an exception nobody anticipated.'],
      ['h','Three forms'],
      ['p','`Result` only reports success or failure. `Result<TError>` reports failure together with an error. `Result<TResult, TError>` carries a value on success and an error on failure.'],
      ['h','Without a value'],
      ['c','public Result Send(Message message)\n{\n    if (delivered)\n        return Result.Ok();\n\n    return Result.Error();\n}'],
      ['h','With a value and an error'],
      ['c','public Result<User, IError> Create(/* ... */)\n{\n    // return the user on success,\n    // or an IError on failure\n}']]},
    option:{lead:'A value that may or may not exist. It replaces null with a type that makes absence explicit.',
      body:[['h','When to use it'],
      ['p','Once a potentially null, or simply absent, value is converted to `Option`, it is evaluated as either `Some` or `None`, and the code must deal with both cases.'],
      ['h','Converting a value'],
      ['c','var option = lib.Method().ToOption();\n\nif (option.IsSome)\n    Console.WriteLine($"Returned value: {option}");\n\nif (option.IsNone)\n    Console.WriteLine("No value was returned.");'],
      ['h','Creating an Option explicitly'],
      ['c','public Option<int> ReturnWhenGreaterThanZero(int input) =>\n    input > 0 ? input : Option.None<int>;']]},
    'value-option':{lead:'The same concept as Option, intended for value types and faster in performance-critical scenarios.',
      body:[['h','When to use it'],
      ['p','`ValueOption` behaves like `Option` but is designed for value types, so it avoids extra cost on hot paths. Reach for it where performance matters, and use `Option` everywhere else.'],
      ['h','Converting a value'],
      ['c','var option = lib.Method().ToValueOption();\n\nif (option.IsSome)\n    Console.WriteLine($"Returned value: {option}");\n\nif (option.IsNone)\n    Console.WriteLine("No value was returned.");']]},
    state:{lead:'A functional abstraction for computations that depend on and modify state.',
      body:[['h','When to use it'],
      ['p','`State<T, S>` lets you work with state in an immutable and composable way, avoiding the explicit passing of state between functions.'],
      ['h','Example'],
      ['c','var state = new State<int, int>(s => (s + 1, s + 2));\nvar mapped = state.Map(x => x * 2, state);']]}
  };
  var TYPES=[
    ['option','Option<T>','A value that may not exist','Replaces null with a type that forces the absence to be handled.'],
    ['value-option','ValueOption<T>','Option for value types','The same idea, tuned for performance-critical code.'],
    ['result','Result<TResult, TError>','Success or a typed error','Failures become explicit values instead of surprise exceptions.'],
    ['choice','Choice<T1, T2, …>','One of up to five types','A union for answers that can take different shapes.'],
    ['state','State<T, S>','Computation with state','Carries state through a sequence of steps without loose variables.']
  ];
  var MARK='<svg class="mark" viewBox="0 0 1041.75 600.25" role="img" aria-label="The Moonad monogram: a yellow crescent moon wrapped around an infinity loop"><use href="#mono-moon"/><use href="#mono-ring"/><use href="#mono-shade"/></svg>';
  function home(){
    var li=TYPES.map(function(t){return '<li><a href="#/docs/'+t[0]+'"><code>'+esc(t[1])+'</code><div><b>'+t[2]+'</b><span>'+t[3]+'</span></div></a></li>';}).join('');
    return '<div class="wrap hero"><div><h1>F# monads for C# developers.</h1><p class="lead">Moonad brings Option, Result, Choice, ValueOption and State to C#. Missing values, failures and alternatives become part of the type instead of a surprise at run time.</p><div class="cta"><a class="btn primary" href="#/docs/install">Install the package</a><a class="btn" href="#/docs/monads">What are monads?</a></div></div><div class="mark-box">'+MARK+'</div></div>'+
    '<section><div class="wrap"><h2>Let the compiler help you</h2><p class="intro">Honest signatures say what can happen. Anyone calling the method knows that absence, errors or alternatives must be handled.</p><div class="compare"><div class="panel"><h3>A signature that hides risk</h3><pre>'+esc('User FindUser(int id);\n// can it return null?\n\nvoid Pay(Order order);\n// does it throw? what?\n\nobject Method();\n// one of several types')+'</pre></div><div class="panel after"><h3>A signature that tells the truth</h3><pre>'+esc('Option<User> FindUser(int id);\n\nResult<Receipt, PayError> Pay(Order o);\n\nChoice<Card, Pix, Boleto> Method();')+'</pre></div></div></div></section>'+
    '<section><div class="wrap"><h2>The monads in the library</h2><p class="intro">The same types the F# community has relied on for years, with the ergonomics C# developers expect.</p><ul class="types">'+li+'</ul></div></section>'+
    '<section><div class="wrap"><h2>Start with one command</h2><p class="intro">Moonad is on NuGet. Add it to your project, then read the page for each type.</p><div class="install"><code id="cmd">dotnet add package Moonad</code><button class="copy" id="copy" type="button">Copy</button></div><div class="links"><a class="btn primary" href="#/docs">Read the documentation</a><a class="btn" href="https://www.nuget.org/packages/Moonad" rel="noopener">NuGet</a><a class="btn" href="https://github.com/moonad-dotnet/moonad" rel="noopener">GitHub</a></div></div></section>';
  }
  function about(){
    return '<div class="wrap"><div class="page"><h1>About Moonad</h1><p class="lead">A simple F# monads port for C#.</p>'+
    '<h2>What it is</h2><p>Moonad is a library that lets C# developers use the same monads found in F#. It takes the main monads from the FSharp.Core library and adapts them to C#.</p>'+
    '<h2>Why it exists</h2><p>The main goal is to protect you from <code>NullReferenceException</code>. By using Moonad, developers can write more robust and safer applications with a smarter design: absence, failure and alternatives are visible in the types.</p>'+
    '<h2>What is inside</h2><p>The library includes <a href="#/docs/choice"><u>Choice</u></a>, <a href="#/docs/result"><u>Result</u></a>, <a href="#/docs/option"><u>Option</u></a>, <a href="#/docs/value-option"><u>ValueOption</u></a> and <a href="#/docs/state"><u>State</u></a>.</p>'+
    '<h2>Open source</h2><p>Moonad is developed in the open. You can read the code and follow the project on GitHub, and install the package from NuGet.</p>'+
    '<div class="links" style="margin:8px 0 28px"><a class="btn primary" href="https://github.com/moonad-dotnet/moonad" rel="noopener">GitHub</a><a class="btn" href="https://www.nuget.org/packages/Moonad" rel="noopener">NuGet</a></div>'+
    '<h2>Support the project</h2><p>If Moonad helps you, you can support its development with a coffee.</p><div class="links"><a class="btn" href="https://ko-fi.com/moonad_dotnet" rel="noopener">Support on Ko-fi</a></div></div></div>';
  }
  function docsIndex(){
    var li=DOCS.map(function(d){return '<li><a href="#/docs/'+d.id+'"><code>'+esc(d.t)+'</code><div><span>'+esc(intro(d.id))+'</span></div></a></li>';}).join('');
    return '<div class="wrap docs">'+side('')+'<div class="doc"><h1>Documentation</h1><p class="lead" style="color:var(--muted)">Start with the idea behind monads, install the package, then pick the type you need.</p><ul class="types" style="margin-top:28px">'+li+'</ul></div></div>';
  }
  function intro(id){return CONTENT[id].lead;}
  function side(cur){
    return '<aside class="side"><a href="#/docs"'+(cur===''?' class="on"':'')+'>Overview</a>'+DOCS.map(function(d){return '<a href="#/docs/'+d.id+'"'+(d.id===cur?' class="on"':'')+'>'+esc(d.t)+'</a>';}).join('')+'</aside>';
  }
  function docPage(id){
    var c=CONTENT[id],i=DOCS.findIndex(function(d){return d.id===id;}),h='';
    c.body.forEach(function(b){
      if(b[0]==='h')h+='<h2>'+inl(b[1])+'</h2>';
      else if(b[0]==='p')h+='<p>'+inl(b[1])+'</p>';
      else h+='<div class="block"><pre>'+esc(b[1])+'</pre></div>';
    });
    var p=DOCS[i-1],n=DOCS[i+1];
    return '<div class="wrap docs">'+side(id)+'<article class="doc"><h1>'+esc(DOCS[i].t)+'</h1><p class="lead" style="color:var(--muted)">'+inl(c.lead)+'</p>'+h+
      '<div class="pn"><span>'+(p?'<a href="#/docs/'+p.id+'">← '+esc(p.t)+'</a>':'')+'</span><span>'+(n?'<a href="#/docs/'+n.id+'">'+esc(n.t)+' →</a>':'')+'</span></div></article></div>';
  }
  function route(){
    var h=(location.hash||'#/').replace(/^#/,''),parts=h.split('/').filter(Boolean),html,title='Moonad — F# monads for C#',nav='';
    if(parts[0]==='about'){html=about();title='About — Moonad';nav='about';}
    else if(parts[0]==='docs'){
      nav='docs';
      var id=parts[1];
      if(id&&CONTENT[id]){html=docPage(id);title=DOCS.find(function(d){return d.id===id;}).t+' — Moonad docs';}
      else{html=docsIndex();title='Documentation — Moonad';}
    }else html=home();
    app.innerHTML=html;document.title=title;
    document.querySelectorAll('[data-nav]').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-nav')===nav);});
    window.scrollTo(0,0);
    var b=document.getElementById('copy');
    if(b)b.addEventListener('click',function(){
      var t=document.getElementById('cmd').textContent;
      function ok(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy';},1800);}
      try{navigator.clipboard.writeText(t).then(ok,function(){});}catch(e){}
    });
  }
  window.addEventListener('hashchange',route);
  try{var s=localStorage.getItem('moonad-theme');if(s==='dark'||s==='light')root.setAttribute('data-theme',s);}catch(e){}
  document.getElementById('theme').addEventListener('click',function(){
    var cur=root.getAttribute('data-theme');
    if(!cur)cur=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    var next=cur==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('moonad-theme',next);}catch(e){}
  });
  route();
})();
</script>
